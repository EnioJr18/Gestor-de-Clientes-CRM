name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crm_pro_ci
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: crm_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_pro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRM_LOAD_DOTENV: "0"
      DATABASE_URL: postgresql://crm_ci:crm_ci_password@127.0.0.1:5432/crm_pro_ci
      TEST_DATABASE_URL: postgresql://crm_ci:crm_ci_password@127.0.0.1:5432/crm_pro_ci_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Apply migrations
        run: python backend/manage.py migrate --noinput
      - name: Verify migration state
        run: |
          python backend/manage.py showmigrations
          python backend/manage.py migrate --plan
          python backend/manage.py makemigrations --check --dry-run
      - name: Run Django checks
        run: python backend/manage.py check
      - name: Run production deployment checks with synthetic configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-synthetic-secret-key-with-sufficient-length-123456789
          DEBUG: "False"
          ALLOWED_HOSTS: ci.example.test
          DATABASE_URL: postgresql://crm_ci:crm_ci_password@127.0.0.1:5432/crm_pro_ci?sslmode=require
          SPA_ENABLED: "False"
          JWT_REFRESH_COOKIE_SECURE: "True"
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
          CACHE_BACKEND: django.core.cache.backends.db.DatabaseCache
          CACHE_LOCATION: crm_ci_cache
          REQUIRE_SHARED_THROTTLE_CACHE: "True"
        run: python backend/manage.py check --deploy
      - name: Validate OpenAPI schema
        run: python backend/manage.py spectacular --validate --file /tmp/openapi.yml
      - name: Check Python dependencies
        run: python -m pip check
      - name: Run backend test suite
        run: python backend/manage.py test -v 2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: crm_pro_ci
      POSTGRES_USER: crm_ci
      POSTGRES_PASSWORD: crm_ci_password
      POSTGRES_TEST_DB: crm_pro_ci_test
      SECRET_KEY: ci-only-synthetic-secret-key-with-sufficient-length-123456789
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag crm-pro-backend:ci .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag crm-pro-frontend:ci frontend
